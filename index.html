<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Extreme Cyber Racer - Mobile Optimized</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Mobile-Friendly Control Bar -->
    <header class="top-bar">
        <div class="control-group">
            <button id="cam-toggle-btn" class="top-btn">📷 Cam: 3rd</button>
            <button id="wiper-btn" class="top-btn" style="display: none;">🌧️ Wiper: OFF</button>
        </div>

        <div class="radio-player">
            <span class="radio-label">📻 Radio:</span>
            <select id="radio-station" class="top-select">
                <option value="off">Off</option>
                <option value="synth">Synthwave</option>
                <option value="cyber">Cyberpunk</option>
            </select>
        </div>

        <div class="stats-group">
            <div id="speed-display">0 <span>KM/H</span></div>
            <div id="score-display">Score: 0</div>
        </div>
    </header>

    <!-- Cockpit View Water Overlay -->
    <div id="cockpit-overlay" class="cockpit-hidden">
        <div id="rain-drops"></div>
        <div id="wiper-blade"></div>
        <div class="dashboard-frame"></div>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="touch-controls">
        <button id="btn-left" class="touch-btn">◀</button>
        <button id="btn-right" class="touch-btn">▶</button>
    </div>

    <!-- 3D Canvas Container -->
    <div id="game-container"></div>

    <!-- Screen Messages -->
    <div id="game-over-screen" class="modal-screen hidden">
        <div class="modal-content">
            <h1>CRASHED!</h1>
            <p id="final-score">Final Score: 0</p>
            <button id="restart-btn" class="action-btn">RETRY</button>
        </div>
    </div>

    <!-- External Libraries Load First -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
