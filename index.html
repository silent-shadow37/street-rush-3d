<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#071018">
  <title>Street Rush 3D V3</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="game"></div>

  <!-- GAME HUD -->
  <div id="hud">

    <div>
      <span>SPEED</span>
      <b id="speed">0</b>
      <small>KM/H</small>
    </div>

    <div>
      <span>RPM</span>
      <b id="rpm">1.0</b>
    </div>

    <div>
      <span>SCORE</span>
      <b id="score">0</b>
    </div>

    <div>
      <span>LAP</span>
      <b id="lap">1/3</b>
    </div>

    <div>
      <span>NITRO</span>
      <b id="nitro">100%</b>
    </div>

    <button id="pause">Ⅱ</button>

  </div>


  <!-- MAIN MENU -->
  <div id="menu" class="screen">

    <div class="card">

      <div class="tag">HIGHWAY RACING</div>

      <h1>
        STREET RUSH
        <em>V3</em>
      </h1>

      <p>
        Traffic • Drift • Nitro • Day/Night
      </p>

      <button id="start">
        START RACE
      </button>

      <button id="quality">
        GRAPHICS: HIGH
      </button>

      <div class="tips">
        A/D or ←/→ steer • S/↓ brake • Space nitro
        <br>
        Mobile: use the on-screen controls
      </div>

    </div>

  </div>


  <!-- PAUSE SCREEN -->
  <div id="pauseScreen" class="screen hidden">

    <div class="card">

      <div class="tag">
        RACE PAUSED
      </div>

      <h2>
        PAUSED
      </h2>

      <button id="resume">
        RESUME
      </button>

      <button id="restart">
        RESTART
      </button>

    </div>

  </div>


  <!-- RESULT SCREEN -->
  <div id="result" class="screen hidden">

    <div class="card">

      <div class="tag">
        RESULT
      </div>

      <h2 id="resultTitle">
        FINISH!
      </h2>

      <p id="resultText"></p>

      <button id="again">
        RACE AGAIN
      </button>

      <button id="home">
        MAIN MENU
      </button>

    </div>

  </div>


  <!-- MOBILE CONTROLS -->
  <div id="touch">

    <div>

      <button id="left">
        ◀
      </button>

      <button id="right">
        ▶
      </button>

    </div>

    <div>

      <button id="brake">
        BRAKE
      </button>

      <button id="boost">
        ⚡
      </button>

    </div>

  </div>


  <div id="toast"></div>


  <!-- THREE.JS -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- GAME CODE -->
  <script src="game.js"></script>

</body>
</html>
